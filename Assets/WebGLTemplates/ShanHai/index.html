<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c2025"><link rel="icon" href="data:,"><title>山海神隐录</title>
<style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#071316;color:#ede4cd;font-family:serif;overflow:hidden}#unity-canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse,#203b3e,#071316);z-index:2}h1{font-weight:400;letter-spacing:.28em;font-size:42px}p{color:#bdac85;letter-spacing:.15em}progress{width:290px;accent-color:#baa16c;height:5px}#error{white-space:pre-wrap;max-width:700px;padding:25px;color:#d5c8aa;font-size:16px}#fullscreen{position:fixed;display:none;border:1px solid #8d805d;background:#102b30e8;color:#eee1c4;padding:0;font-family:inherit;cursor:pointer;z-index:1}</style></head>
<body><canvas id="unity-canvas" width="1600" height="900" tabindex="-1"></canvas><button id="fullscreen">全屏</button><div id="loading"><h1>山海神隐录</h1><p>正在展开山海古卷</p><progress id="progress" max="1" value="0"></progress><div id="error"></div></div>
<script>
const canvas=document.getElementById('unity-canvas');
const loading=document.getElementById('loading');
const fullscreen=document.getElementById('fullscreen');
let ready=false;
function placeFullscreen(){
  const w=window.innerWidth,h=window.innerHeight,s=Math.min(w/1600,h/900);
  fullscreen.style.display=ready&&w>=h&&document.fullscreenEnabled!==false?'block':'none';
  Object.assign(fullscreen.style,{left:((w-1600*s)/2+650*s)+'px',top:((h-900*s)/2+856*s)+'px',width:(130*s)+'px',height:(37*s)+'px',fontSize:(20*s)+'px'});
}
window.addEventListener('resize',placeFullscreen);
const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';
script.onload=()=>createUnityInstance(canvas,{
dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',
streamingAssetsUrl:'StreamingAssets',companyName:'ShanHai Studio',productName:'山海神隐录',productVersion:'0.4.1',
matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5)
},p=>document.getElementById('progress').value=p).then(instance=>{loading.style.display='none';canvas.focus();ready=true;placeFullscreen();fullscreen.onclick=()=>instance.SetFullscreen(1);}).catch(e=>document.getElementById('error').textContent='加载失败：'+e+'\n请刷新页面，或使用支持 WebGL 2 的浏览器。');
script.onerror=()=>document.getElementById('error').textContent='构建文件未能加载，请检查网络连接。';document.body.appendChild(script);
window.addEventListener('contextmenu',e=>e.preventDefault());
</script></body></html>
